<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>小星的身體小星球</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: one open picture book on a sky-blue table — illustration page left, story page right; playback dock below. Single bright look by choice. */
:root{
  --sky:#d4effb; --sky2:#aedff4;
  --paper:#fffaf0; --paper-edge:#eadcbc; --line:#e9dcc0;
  --ink:#2b2a3a; --muted:#646379;
  --red:#e0505a; --yellow:#efab2c; --green:#2f9e6c;
  --accent:#3b50c4; --accent-soft:#e8ebfd; --accent-ink:#ffffff;
  --hl:#ffe680; --hl-edge:#f2c94c;
  --story:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --ui:"Fredoka","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --fs:1.6rem;
  color-scheme:light;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100%;
  background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%); background-color:var(--sky);
  color:var(--ink); font-family:var(--ui); font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 28px;
  -webkit-user-select:none; user-select:none;
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--accent);outline-offset:3px;border-radius:10px}

.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:44px;height:44px;flex-shrink:0}
.brand h1{margin:0;font-family:var(--story);font-weight:700;font-size:1.35rem;line-height:1.2;text-wrap:balance}
.brand small{display:block;font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.04em}
.counter{font-weight:700;font-variant-numeric:tabular-nums;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.95rem}

/* book */
.book{position:relative;background:var(--paper);border-radius:24px;overflow:hidden;
  box-shadow:0 3px 0 var(--paper-edge),0 6px 0 #dfcfac,0 24px 40px -20px rgba(20,70,110,.5);perspective:1600px}
.timer{position:absolute;left:0;top:0;height:6px;width:0;background:var(--accent);z-index:3;border-radius:0 6px 6px 0}
.spread{display:grid;grid-template-columns:1.25fr 1fr;min-height:min(66vh,560px);transform-origin:left center}
.art{background:#e7f5fc;border-right:2px dashed var(--line);display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
.art svg{width:100%;height:auto;display:block;max-height:min(66vh,560px)}
.text{padding:28px clamp(18px,3vw,38px);display:flex;flex-direction:column;justify-content:center;gap:16px;min-width:0}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pno{font-size:.8rem;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700;padding:4px 12px;border-radius:999px;border:2px solid currentColor;background:#fff}
.tag i{width:12px;height:12px;border-radius:50%;background:currentColor;display:inline-block}
.tag.red{color:var(--red)} .tag.yellow{color:#b97a0c} .tag.green{color:var(--green)} .tag.purple{color:#7a4fc9}
.sents{display:flex;flex-direction:column;gap:6px}
.sent{font-family:var(--story);font-size:var(--fs);line-height:1.7;padding:2px 10px;margin:0 -10px;border-radius:12px;cursor:pointer;transition:background-color .25s,box-shadow .25s}
.sent:hover{background:#fff3c9}
.sent.on{background:var(--hl);box-shadow:inset 0 0 0 2px var(--hl-edge)}
.sent.ttl{font-weight:700;font-size:calc(var(--fs)*1.45);line-height:1.35;text-wrap:balance}
.think{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:14px;padding:10px 12px;margin-top:4px}
.think b{flex-shrink:0;font-size:.8rem;letter-spacing:.1em;background:var(--accent);color:var(--accent-ink);padding:3px 9px;border-radius:999px}
.think p{margin:0;flex:1;font-weight:600;line-height:1.5;min-width:0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.cta button{border:0;border-radius:16px;padding:12px 18px;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;gap:8px}
.cta .main{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 #26369a}
.cta .alt{background:#fff;border:2px solid var(--line)}
.cta button:active{transform:translateY(3px);box-shadow:none}

.mini{width:36px;height:36px;border-radius:50%;border:2px solid #cfd5fb;background:#fff;color:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.mini svg{width:18px;height:18px}

/* page-turn motion */
.in-next{animation:inNext .5s cubic-bezier(.2,.8,.3,1)}
.in-prev{animation:inPrev .5s cubic-bezier(.2,.8,.3,1)}
@keyframes inNext{from{opacity:.0;transform:rotateY(-14deg) translateX(40px)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:.0;transform:rotateY(10deg) translateX(-40px)}to{opacity:1;transform:none}}

/* dots */
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.dot{min-width:34px;height:34px;border-radius:999px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;padding:0 8px}
.dot.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot.seen{border-color:#9aa6ec}

/* dock */
.dock{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 18px}
.grp{display:flex;align-items:center;gap:8px}
.grp-label{font-size:.78rem;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.ibtn{width:52px;height:52px;border-radius:16px;border:2px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--line)}
.ibtn svg{width:24px;height:24px}
.ibtn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.ibtn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.play{width:68px;height:68px;border-radius:50%;background:var(--accent);border:0;color:var(--accent-ink);box-shadow:0 4px 0 #26369a}
.play svg{width:30px;height:30px}
.seg{display:inline-flex;background:#f1eadb;border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:10px;padding:9px 14px;font-weight:700;font-size:.95rem}
.seg button[aria-pressed="true"]{background:#fff;color:var(--accent);box-shadow:0 2px 0 var(--line)}
.step{display:inline-flex;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px}
.step button{width:42px;height:42px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center}
.step button svg{width:18px;height:18px}
.step output{min-width:58px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.status{text-align:center;font-weight:600;color:var(--muted);min-height:1.4em;font-size:.95rem}
.ibtn.off{color:#9b98ad}

/* settings sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(30,40,70,.45);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{background:var(--paper);border-radius:22px;width:100%;max-width:540px;max-height:100%;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.panel header{display:flex;justify-content:space-between;align-items:center}
.panel h2{margin:0;font-family:var(--story);font-size:1.4rem}
.row{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:2px dashed var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row .lab{display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:8px}
.row .lab span{font-size:.85rem;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.row small{color:var(--muted);font-weight:600;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
select{width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:600}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0}
.fsbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fsbtns button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 0;font-family:var(--story);font-weight:700}
.fsbtns button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.done{border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px;font-weight:700;font-size:1rem}
.x{width:40px;height:40px;border-radius:50%;border:0;background:#f1eadb;font-size:1.2rem;font-weight:700}

/* svg ambience */
.sway{animation:sway 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}
.sway.s2{animation-delay:-1.3s}
@keyframes sway{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}
.bob{animation:bob 1.8s ease-in-out infinite alternate}
.bob.b2{animation-delay:-.9s}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.twinkle{animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
.drift{animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(10px)}}
.spinr{animation:spinr 24s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spinr{to{transform:rotate(360deg)}}

@media (max-width:820px){
  .spread{grid-template-columns:1fr;min-height:0}
  .art{border-right:0;border-bottom:2px dashed var(--line)}
  .art svg{max-height:none}
  .text{padding:20px 18px 24px}
  .dock{gap:10px 12px}
}
@media (max-width:420px){
  .grp-label{display:none}
  .seg button{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
        <ellipse cx="22" cy="23" rx="20" ry="5" fill="none" stroke="#efab2c" stroke-width="3" transform="rotate(-14 22 23)"/>
        <circle cx="22" cy="22" r="13" fill="#f39a6a"/>
        <circle cx="18" cy="21" r="1.6" fill="#5a2a1a"/><circle cx="26" cy="21" r="1.6" fill="#5a2a1a"/>
        <path d="M18.5,25.5 Q22,28.5 25.5,25.5" stroke="#5a2a1a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <div><h1>小星的身體小星球</h1><small>界限星球島 · 有聲繪本</small></div>
    </div>
    <div class="counter" id="counter" aria-live="polite">封面</div>
  </div>

  <div class="book" id="book">
    <div class="timer" id="timer"></div>
    <div class="spread" id="spread"></div>
  </div>

  <nav class="dots" id="dots" aria-label="跳到頁面"></nav>

  <div class="dock" role="toolbar" aria-label="播放控制">
    <div class="grp">
      <button class="ibtn" id="prev" aria-label="上一頁"></button>
      <button class="ibtn play" id="playBtn" aria-label="播放"></button>
      <button class="ibtn" id="next" aria-label="下一頁"></button>
    </div>
    <div class="grp">
      <span class="grp-label">翻頁</span>
      <div class="seg" role="group" aria-label="翻頁方式">
        <button id="modeManual" aria-pressed="true">手動</button>
        <button id="modeAuto" aria-pressed="false">自動</button>
      </div>
    </div>
    <div class="grp">
      <span class="grp-label">速度</span>
      <div class="step">
        <button id="slower" aria-label="放慢"></button>
        <output id="rateOut">0.90x</output>
        <button id="faster" aria-label="加快"></button>
      </div>
    </div>
    <div class="grp">
      <button class="ibtn" id="voiceBtn" aria-label="朗讀聲音開關"></button>
      <button class="ibtn" id="setBtn" aria-label="更多設定"></button>
    </div>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">按下藍色播放鍵，開始聽故事。</div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <header><h2 id="setTitle">閱讀與聲音設定</h2><button class="x" id="closeSet" aria-label="關閉">×</button></header>

    <div class="row">
      <div class="lab">翻頁方式</div>
      <div class="seg" role="group" aria-label="翻頁方式">
        <button id="sModeManual" aria-pressed="true">手動翻頁</button>
        <button id="sModeAuto" aria-pressed="false">自動翻頁</button>
      </div>
      <small>自動翻頁：每頁讀完後，等幾秒自動翻到下一頁。</small>
    </div>
    <div class="row">
      <div class="lab"><label for="delay">自動翻頁等待</label><span id="delayOut">3 秒</span></div>
      <input type="range" id="delay" min="1" max="10" step="1" value="3">
    </div>
    <div class="row">
      <label class="switch" for="autoRead">手動翻頁時，翻到新頁自動朗讀<input type="checkbox" id="autoRead"></label>
      <label class="switch" for="loop">自動翻頁讀完封底後，從封面重播<input type="checkbox" id="loop"></label>
    </div>
    <div class="row">
      <div class="lab"><label for="rate">朗讀速度</label><span id="rateOut2">0.90x</span></div>
      <input type="range" id="rate" min="0.5" max="1.5" step="0.05" value="0.9">
      <small>0.6～0.8 適合剛開始聽故事或需要更多處理時間的孩子。</small>
    </div>
    <div class="row">
      <div class="lab"><label for="pitch">音調高低</label><span id="pitchOut">1.05</span></div>
      <input type="range" id="pitch" min="0.6" max="1.5" step="0.05" value="1.05">
    </div>
    <div class="row">
      <div class="lab"><label for="voiceSel">朗讀音色</label></div>
      <select id="voiceSel"><option value="">系統預設中文語音</option></select>
      <button class="cta alt" id="tryVoice" style="border:2px solid var(--line);border-radius:14px;padding:10px;font-weight:700;background:#fff">試聽目前的聲音</button>
    </div>
    <div class="row">
      <div class="lab">故事字體大小</div>
      <div class="fsbtns" id="fsbtns"></div>
    </div>
    <div class="row">
      <label class="switch" for="hlOn">朗讀時逐句標示<input type="checkbox" id="hlOn"></label>
      <label class="switch" for="sfxOn">翻頁音效<input type="checkbox" id="sfxOn"></label>
    </div>
    <button class="done" id="doneSet">完成</button>
  </div>
</div>

<script>
/* ===================== icons ===================== */
const IC = {
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 12h12"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg>',
  spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>'
};

/* ===================== illustration kit ===================== */
const SK = '#fddcb5';
const KC = {
  star:{shirt:'#5cc8e6',pants:'#4f5bd5'}, sunny:{shirt:'#f78fa0',pants:'#8b6fd6'},
  ann:{shirt:'#6fcf8f',pants:'#2f6f5e'}, yu:{shirt:'#ffb347',pants:'#3d5a99'},
  pal:{shirt:'#c9a2f0',pants:'#6b5b45'}, teacher:{shirt:'#4fb5a6',pants:'#3d4f6a'}
};
function starPts(cx,cy,r){ const p=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r; p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1)); } return p.join(' '); }
function hair(t){
  switch(t){
    case 'star': return {front:`<path d="M-27,-94 C-28,-128 28,-128 27,-94 C22,-112 6,-114 0,-106 C-6,-114 -22,-112 -27,-94Z" fill="#33415c"/><polygon points="${starPts(-13,-111,6)}" fill="#ffd23f"/>`};
    case 'sunny': return {back:`<ellipse cx="-30" cy="-80" rx="8" ry="15" fill="#7a4a24" transform="rotate(-18 -30 -80)"/><ellipse cx="30" cy="-80" rx="8" ry="15" fill="#7a4a24" transform="rotate(18 30 -80)"/>`,
      front:`<path d="M-27,-92 C-28,-130 28,-130 27,-92 C24,-112 4,-116 0,-110 C-4,-116 -24,-112 -27,-92Z" fill="#7a4a24"/><circle cx="-26" cy="-93" r="4" fill="#ef4c62"/><circle cx="26" cy="-93" r="4" fill="#ef4c62"/>`};
    case 'ann': return {front:`<polygon points="-17,-110 -11,-126 -4,-114" fill="#1f2937"/><polygon points="-5,-116 2,-131 9,-116" fill="#1f2937"/><polygon points="7,-114 15,-126 19,-109" fill="#1f2937"/><path d="M-27,-94 C-28,-126 28,-126 27,-94 C18,-108 -18,-108 -27,-94Z" fill="#1f2937"/>`};
    case 'yu': return {front:`<path d="M-27,-96 C-27,-128 27,-128 27,-96Z" fill="#2b7bd3"/><ellipse cx="9" cy="-97" rx="30" ry="6" fill="#1c5fa8"/><circle cx="0" cy="-121" r="3" fill="#f4b740"/>`};
    case 'pal': return {front:`<path d="M-27,-92 C-28,-125 28,-125 27,-92 C22,-104 10,-108 4,-102 C-2,-108 -20,-104 -27,-92Z" fill="#a0522d"/>`};
    case 'teacher': return {back:`<circle cx="0" cy="-124" r="11" fill="#4a3426"/><path d="M-27,-92 C-34,-70 -30,-60 -24,-58 L-22,-92Z" fill="#4a3426"/><path d="M27,-92 C34,-70 30,-60 24,-58 L22,-92Z" fill="#4a3426"/>`,
      front:`<path d="M-27,-92 C-28,-130 28,-130 27,-92 C20,-110 -2,-114 -6,-104 C-10,-112 -24,-108 -27,-92Z" fill="#4a3426"/>`};
  }
  return {};
}
function face(m='happy'){
  const mouth = { happy:'<path d="M-7,-82 Q0,-73 7,-82" stroke="#c0392b" stroke-width="2.6" fill="none" stroke-linecap="round"/>',
    calm:'<path d="M-5,-80 Q0,-77 5,-80" stroke="#c0392b" stroke-width="2.6" fill="none" stroke-linecap="round"/>',
    sad:'<path d="M-6,-77 Q0,-83 6,-77" stroke="#c0392b" stroke-width="2.6" fill="none" stroke-linecap="round"/>',
    surprised:'<ellipse cx="0" cy="-79" rx="3.2" ry="4" fill="#c0392b"/>' }[m];
  return `<circle cx="-9" cy="-92" r="3.3" fill="#2b2a3a"/><circle cx="9" cy="-92" r="3.3" fill="#2b2a3a"/>
    <circle cx="-8" cy="-93.5" r="1.1" fill="#fff"/><circle cx="10" cy="-93.5" r="1.1" fill="#fff"/>
    <ellipse cx="-16" cy="-83" rx="5" ry="3" fill="#f87171" opacity=".45"/><ellipse cx="16" cy="-83" rx="5" ry="3" fill="#f87171" opacity=".45"/>${mouth}`;
}
function kid(t,x,y,o={}){
  const C=KC[t], s=o.s||1, seated=t==='yu', dy=seated?-14:0, H=hair(t), arm=o.arm||'down';
  let g=`<g transform="translate(${x} ${y}) scale(${o.flip?-s:s} ${s})">`;
  if(seated){
    g+=`<circle cx="-6" cy="-26" r="30" fill="none" stroke="#4b5563" stroke-width="5"/><circle cx="-6" cy="-26" r="4" fill="#4b5563"/>
      <path d="M-6,-54 V2 M-34,-26 H22 M-26,-46 L14,-6 M-26,-6 L14,-46" stroke="#a3abb8" stroke-width="1.6"/>
      <path d="M-30,-98 L-24,-40 L30,-40 L32,-6" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="0" r="6" fill="#4b5563"/>`;
  }
  g+=`<g transform="translate(0 ${dy})">`;
  if(H.back) g+=H.back;
  g+=`<rect x="-20" y="-66" width="40" height="46" rx="15" fill="${C.shirt}"/>`;
  g+=`<path d="M-17,-58 L-25,-30" stroke="${SK}" stroke-width="9" stroke-linecap="round"/>`;
  const R = { down:'M17,-58 L25,-30', wave:'M17,-58 L32,-92', reach:'M17,-56 L47,-52', point:'M17,-58 L44,-80', sign:'M17,-58 L26,-92' }[arm];
  g+=`<path d="${R}" stroke="${SK}" stroke-width="9" stroke-linecap="round"/>`;
  if(arm==='wave') g+=`<path d="M40,-104 q6,6 0,12 M46,-108 q9,10 0,20" stroke="#f4a72b" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  if(arm==='sign'){ const col=o.sign==='green'?'#2f9e6c':'#e0505a', tx=o.sign==='green'?'OK':'NO';
    g+=`<g transform="translate(27 -100) rotate(6)"><rect x="-17" y="-34" width="34" height="36" rx="6" fill="${col}" stroke="#fff" stroke-width="2.5"/><text x="0" y="-10" text-anchor="middle" font-size="14" font-weight="700" fill="#fff" font-family="Fredoka,sans-serif">${tx}</text></g>`; }
  g+=`<circle cx="-26" cy="-90" r="5" fill="${SK}"/><circle cx="26" cy="-90" r="5" fill="${SK}"/><circle cx="0" cy="-92" r="26" fill="${SK}"/>`;
  g+=(H.front||'')+face(o.mood);
  g+=`</g>`;
  if(seated){
    g+=`<rect x="-10" y="-46" width="42" height="13" rx="6" fill="${C.pants}"/><rect x="21" y="-46" width="13" height="38" rx="6" fill="${C.pants}"/><ellipse cx="31" cy="-7" rx="10" ry="5" fill="#3a3a4a"/>`;
  } else {
    g+=`<rect x="-15" y="-24" width="12" height="24" rx="6" fill="${C.pants}"/><rect x="3" y="-24" width="12" height="24" rx="6" fill="${C.pants}"/><ellipse cx="-10" cy="0" rx="9" ry="4.5" fill="#3a3a4a"/><ellipse cx="10" cy="0" rx="9" ry="4.5" fill="#3a3a4a"/>`;
  }
  return g+'</g>';
}

function sea(y){ let d=`M0,${y+6}`; for(let x=0;x<400;x+=20) d+=` q10,-5 20,0`; return `<rect x="0" y="${y}" width="400" height="${300-y}" fill="url(#gsea)"/><path d="${d}" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>`; }

function planet(x,y,r,spin=true){
  const R=r*1.55, ry=r*.34;
  return `<g transform="translate(${x} ${y})"><ellipse rx="${R}" ry="${ry}" fill="none" stroke="#ffd56b" stroke-width="${r*.12}" transform="rotate(-14)"/>
  <circle r="${r}" fill="url(#gpl)"/><circle cx="${-r*.36}" cy="${-r*.32}" r="${r*.15}" fill="#fff" opacity=".35"/><circle cx="${r*.35}" cy="${r*.38}" r="${r*.09}" fill="#fff" opacity=".25"/>
  <circle cx="${-r*.28}" cy="${-r*.04}" r="${r*.08}" fill="#5a2a1a"/><circle cx="${r*.28}" cy="${-r*.04}" r="${r*.08}" fill="#5a2a1a"/>
  <path d="M${-r*.22},${r*.2} Q0,${r*.42} ${r*.22},${r*.2}" stroke="#5a2a1a" stroke-width="${r*.07}" fill="none" stroke-linecap="round"/>

  <path d="M${-R},0 A${R},${ry} 0 0 0 ${R},0" fill="none" stroke="#ffd56b" stroke-width="${r*.12}" transform="rotate(-14)"/></g>`;

function badge(x,y,k,r=17){
  const col={red:'#e0505a',yellow:'#efab2c',green:'#2f9e6c'}[k];
  const ic={red:`<path d="M${x-6},${y-6} L${x+6},${y+6} M${x+6},${y-6} L${x-6},${y+6}" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>`,

  return `<circle cx="${x}" cy="${y}" r="${r+4}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${r}" fill="${col}"/>${ic}`;
}
function bubble(x,top,text,o={}){
  const fs=o.fs||14, w=[...text].length*fs+26, h=fs+20, l=x-w/2, tx=x+(o.tail||0)*w*.25;
  return `<g><polygon points="${tx-7},${top+h-2} ${tx+7},${top+h-2} ${tx+(o.tail||0)*8},${top+h+12}" fill="#fff" stroke="#2b2a3a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="${l}" y="${top}" width="${w}" height="${h}" rx="13" fill="#fff" stroke="#2b2a3a" stroke-width="2"/>
  <rect x="${tx-6}" y="${top+h-3}" width="12" height="4" fill="#fff"/>

}

  { art:'p2', s:['有一天，老師帶大家坐在沙灘上。','老師說：「每個人的身體，都是一顆最珍貴的小星球。」','「你就是自己星球的主人。」'],
    think:'你的小星球，主人是誰？' },
  { art:'p3', tag:['purple','三種燈號'], s:['小星球上有三種燈。','綠燈：揮揮手、笑一笑、說早安，大家都可以。','黃燈：牽手、拍肩膀、摸頭，要先問問才可以。','紅燈：泳衣蓋住的地方是隱私處，別人不能碰、不能看，也不能拍照。'],
    think:'拍肩膀是哪一種燈？要先做什麼？' },
  { art:'p4', tag:['yellow','黃燈・先問問'], s:['排隊溜滑梯的時候，小晴想牽小安的手。','她先停下來問：「我可以牽你的手嗎？」','小安笑著說：「好啊！」','因為先問了，兩個人都覺得好開心。'],
    think:'小晴牽手前，先做了什麼事？' },
  { art:'p5', tag:['red','勇敢說不要'], s:['盪鞦韆旁邊，有一位同學想摸小宇的頭髮，還想推他的輪椅。','輪椅就像小宇的腳，也是他小星球的一部分。','小宇舉起紅牌，說：「請不要碰我，我不喜歡。」'],
    think:'小宇用什麼方法說「不要」？' },
  { art:'p6', tag:['green','聽見不要就停下'], s:['那位同學馬上把手放下，往後退了一步。','他說：「對不起，我知道了。」','聽見「不要」，就立刻停下來，這就是尊重。'],
    think:'聽見別人說「不要」時，應該怎麼做？' },
  { art:'p7', tag:['red','說出來'], s:['如果有人碰了你的紅燈隱私處，還要你保守秘密，','這種讓人不舒服的秘密，不用守。','你可以大聲說「不行」，趕快走開，','然後告訴老師、爸爸媽媽，或你信任的大人。','說出來，不是你的錯，大人會幫助你。'],
    think:'你信任的大人有誰？說出兩個人。' },
  { art:'p8', tag:['purple','每一種說法都算數'], s:['說「不要」有很多種方法。','可以用嘴巴說，可以搖搖頭，可以舉起紅牌，也可以按下語音按鈕。','小星說話比較慢，大家就耐心等他說完。','每一種說法都算數，都要被好好聽見。'],
    think:'你最喜歡用哪一種方法說「不要」？' },
  { art:'p9', s:['太陽快下山了，大家一起坐上旋轉木馬。','小晴問：「明天還可以一起玩嗎？」','大家一起說：「好啊！」','我們都是自己小星球的主人，也是彼此的好朋友。'],
    think:'明天你想邀請誰一起玩？你會怎麼問？' },
  { art:'back', label:'封底', ttl:true, back:true,
    s:['我記住了！','綠燈，揮手打招呼。','黃燈，先問問才可以。','紅燈，隱私處不能碰。','聽見不要，馬上停下來。','不舒服的秘密，要告訴信任的大人。'] }
];
const LAST = PAGES.length-1;

/* ===================== settings ===================== */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem('pb-star-'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem('pb-star-'+k, JSON.stringify(v)); }catch(e){} }
};
const S = Object.assign({ mode:'manual', rate:.9, pitch:1.05, voice:'', delay:3, autoRead:true, loop:false, fs:2, hl:true, sfx:true, voiceOn:true }, LS.get('settings',{}));
const save = () => LS.set('settings', S);
const FS = [1.2,1.4,1.6,1.85,2.15];

/* ===================== state ===================== */
const $ = id => document.getElementById(id);
const st = { page:0, sent:0, playing:false, run:0 };
const seen = new Set([0]);
const hasTTS = 'speechSynthesis' in window;
let voices = [], simTimer=null, watchTimer=null, cdTimer=null, cdTick=null, unlocked=false;

/* ===================== speech ===================== */
function loadVoices(){
  if(!hasTTS) return;
  voices = speechSynthesis.getVoices();
  const isZh = v => /zh|cmn/i.test(v.lang);
  const zh = voices.filter(isZh);
  if(!S.voice || !voices.some(v=>v.voiceURI===S.voice)){
    const pick = zh.find(v=>/TW/i.test(v.lang)) || zh.find(v=>/HK/i.test(v.lang)) || zh[0];
    S.voice = pick ? pick.voiceURI : '';
  }
  const sel = $('voiceSel');
  if(!voices.length){ sel.innerHTML='<option value="">系統預設中文語音</option>'; return; }
  sel.innerHTML = '';
  [...zh, ...voices.filter(v=>!isZh(v))].forEach(v=>{
    const o=document.createElement('option'); o.value=v.voiceURI; o.textContent=(isZh(v)?'★ ':'')+v.name+'（'+v.lang+'）';
    if(v.voiceURI===S.voice) o.selected=true; sel.appendChild(o);
  });
}
if(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function unlock(){
  if(unlocked || !hasTTS) return; unlocked=true;
  try{ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }catch(e){}
}
function est(t){ return Math.max(1300, t.replace(/[「」，。！？、：]/g,'').length*270/S.rate + 600); }
function speak(text, done){
  let fin=false; const finish=()=>{ if(fin) return; fin=true; clearTimeout(watchTimer); done(); };
  if(!S.voiceOn || !hasTTS){ simTimer=setTimeout(finish, est(text)); return; }
  const u = new SpeechSynthesisUtterance(text.replace(/[「」]/g,''));
  u.lang='zh-TW'; u.rate=S.rate; u.pitch=S.pitch;
  const v = voices.find(x=>x.voiceURI===S.voice); if(v){ u.voice=v; u.lang=v.lang; }
  u.onend=finish; u.onerror=finish; window.__utter=u;
  watchTimer=setTimeout(finish, est(text)*2.4+3000);
  speechSynthesis.speak(u);
}
function stopAll(){
  st.run++; clearTimeout(simTimer); clearTimeout(watchTimer); clearCountdown();
  if(hasTTS) speechSynthesis.cancel();
}
function startReading(from=0){
  stopAll(); const run=st.run;
  st.playing=true; st.sent=from; ui();
  setTimeout(()=>readNext(run), (hasTTS && S.voiceOn) ? 90 : 0);
}
function readNext(run){
  if(run!==st.run) return;
  const ss = PAGES[st.page].s;
  if(st.sent>=ss.length){ highlight(-1); pageDone(run); return; }
  highlight(st.sent);
  status(S.voiceOn ? `朗讀中：第 ${st.sent+1} / ${ss.length} 句` : `安靜閱讀：第 ${st.sent+1} / ${ss.length} 句`);
  speak(ss[st.sent], ()=>{ if(run!==st.run) return; st.sent++; readNext(run); });
}
function pageDone(run){
  if(S.mode==='auto'){
    if(st.page<LAST) countdown(S.delay, ()=>{ if(run===st.run) turn(st.page+1, true); });
    else if(S.loop) countdown(S.delay, ()=>{ if(run===st.run) turn(0, true); });
    else { st.playing=false; status('故事讀完了！按播放鍵可以再聽一次。'); ui(); }
  } else {
    st.playing=false;
    status(st.page<LAST ? '這一頁讀完了，按「下一頁」繼續。' : '故事讀完了！');
    ui();
  }
}
function countdown(sec, cb){
  clearCountdown();
  const bar=$('timer'); bar.style.transition='none'; bar.style.width='0';
  void bar.offsetWidth; bar.style.transition=`width ${sec}s linear`; bar.style.width='100%';
  let left=sec; const msg=()=>status(`${left} 秒後自動翻到${st.page<LAST?'下一頁':'封面'}…（按暫停可停下）`);
  msg(); cdTick=setInterval(()=>{ left--; if(left>0) msg(); }, 1000);
  cdTimer=setTimeout(()=>{ clearCountdown(); cb(); }, sec*1000);
}
function clearCountdown(){
  clearTimeout(cdTimer); clearInterval(cdTick);
  const bar=$('timer'); bar.style.transition='none'; bar.style.width='0';
}

/* ===================== page turning ===================== */
function turn(n, keepPlaying=false){
  if(n<0 || n>LAST || n===st.page && !keepPlaying) return;
  const dir = n>=st.page ? 1 : -1, was = st.playing;
  stopAll(); st.page=n; st.sent=0; seen.add(n);
  render(dir); flipSound();
  if(keepPlaying || (S.mode==='auto' && was)) startReading(0);
  else if(S.mode==='manual' && S.autoRead) startReading(0);
  else { st.playing=false; status(S.mode==='auto' ? '按播放鍵開始自動朗讀與翻頁。' : '按播放鍵聽這一頁。'); ui(); }
}
function togglePlay(){
  unlock();
  if(st.playing){ stopAll(); st.playing=false; status('已暫停，按播放鍵從這一句繼續。'); ui(); return; }
  const len = PAGES[st.page].s.length;
  if(st.sent>=len){
    if(S.mode==='auto' && st.page<LAST){ turn(st.page+1, true); return; }
    st.sent=0;
  }
  startReading(st.sent);
}

/* ===================== render ===================== */
const spread=$('spread');
function render(dir=0){
  const P=PAGES[st.page];
  const pno = P.label || `第 ${st.page} 頁`;
  const tag = P.tag ? `<span class="tag ${P.tag[0]}"><i></i>${P.tag[1]}</span>` : '';
  const sents = P.s.map((t,i)=>`<div class="sent${P.ttl&&i===0?' ttl':''}" role="button" tabindex="0" data-i="${i}" aria-label="從這句開始朗讀：${t}">${t}</div>`).join('');
  let extra='';
  if(P.think) extra = `<div class="think"><b>想一想</b><p>${P.think}</p><button class="mini" data-say="${P.think}" aria-label="朗讀想一想">${IC.spk}</button></div>`;
  if(P.cover) extra = `<div class="cta"><button class="main" data-act="listen">${IC.play.replace('<svg','<svg width="20" height="20"')} 開始聽故事</button><button class="alt" data-act="self">自己翻頁閱讀 ${IC.next.replace('<svg','<svg width="18" height="18"')}</button></div>`;
  if(P.back) extra = `<div class="cta"><button class="main" data-act="again">從第一頁再讀一次</button><button class="alt" data-act="cover">回到封面</button></div>`;
  spread.innerHTML = `<figure class="art" style="margin:0">${ART[P.art]()}</figure>
    <section class="text" aria-label="${pno}"><div class="meta"><span class="pno">${pno}</span>${tag}</div><div class="sents">${sents}</div>${extra}</section>`;
  spread.classList.remove('in-next','in-prev'); void spread.offsetWidth;
  if(dir) spread.classList.add(dir>0?'in-next':'in-prev');
  $('counter').textContent = st.page===0 ? '封面' : st.page===LAST ? '封底' : `第 ${st.page} / ${LAST-1} 頁`;
  ui();
}
function highlight(i){
  spread.querySelectorAll('.sent').forEach(el=>el.classList.toggle('on', S.hl && +el.dataset.i===i));
  const on = spread.querySelector('.sent.on');
  if(on && window.innerWidth<=820){ const r=on.getBoundingClientRect(); if(r.top<0 || r.bottom>innerHeight-120) on.scrollIntoView({block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
}
function buildDots(){
  $('dots').innerHTML = PAGES.map((p,i)=>`<button class="dot" data-p="${i}" aria-label="${i===0?'封面':i===LAST?'封底':'第 '+i+' 頁'}">${i===0?'封面':i===LAST?'封底':i}</button>`).join('');
}
function ui(){
  $('playBtn').innerHTML = st.playing ? IC.pause : IC.play;
  $('playBtn').setAttribute('aria-label', st.playing ? '暫停' : '播放');
  $('prev').disabled = st.page===0; $('next').disabled = st.page===LAST;
  ['modeManual','sModeManual'].forEach(id=>$(id).setAttribute('aria-pressed', S.mode==='manual'));
  ['modeAuto','sModeAuto'].forEach(id=>$(id).setAttribute('aria-pressed', S.mode==='auto'));
  const r = S.rate.toFixed(2)+'x'; $('rateOut').textContent=r; $('rateOut2').textContent=r; $('rate').value=S.rate;
  $('pitchOut').textContent=S.pitch.toFixed(2); $('pitch').value=S.pitch;
  $('delay').value=S.delay; $('delayOut').textContent=S.delay+' 秒';
  $('autoRead').checked=S.autoRead; $('loop').checked=S.loop; $('hlOn').checked=S.hl; $('sfxOn').checked=S.sfx;
  $('voiceBtn').innerHTML = S.voiceOn ? IC.spk : IC.mute; $('voiceBtn').classList.toggle('off', !S.voiceOn);
  $('voiceBtn').setAttribute('aria-label', S.voiceOn ? '關閉朗讀聲音' : '開啟朗讀聲音');
  document.querySelectorAll('.dot').forEach(d=>{ const i=+d.dataset.p; d.classList.toggle('cur', i===st.page); d.classList.toggle('seen', seen.has(i)); });
  document.querySelectorAll('#fsbtns button').forEach((b,i)=>b.setAttribute('aria-pressed', i===S.fs));
  document.documentElement.style.setProperty('--fs', FS[S.fs]+'rem');
}
function status(t){ $('status').textContent=t; }

/* ===================== sound effect ===================== */
let actx=null;
function flipSound(){
  if(!S.sfx) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const len=actx.sampleRate*.22, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const src=actx.createBufferSource(); src.buffer=buf;
    const f=actx.createBiquadFilter(); f.type='bandpass'; f.Q.value=.8;
    f.frequency.setValueAtTime(900,actx.currentTime); f.frequency.exponentialRampToValueAtTime(3200,actx.currentTime+.2);
    const g=actx.createGain(); g.gain.value=.22;
    src.connect(f); f.connect(g); g.connect(actx.destination); src.start();
  }catch(e){}
}

/* ===================== wiring ===================== */
$('prev').innerHTML=IC.prev; $('next').innerHTML=IC.next; $('slower').innerHTML=IC.minus; $('faster').innerHTML=IC.plus; $('setBtn').innerHTML=IC.gear;
$('fsbtns').innerHTML = FS.map((f,i)=>`<button style="font-size:${.8+i*.14}rem" aria-label="字體 ${i+1} 級">字</button>`).join('');
buildDots();

$('playBtn').onclick = togglePlay;
$('prev').onclick = ()=>{ unlock(); turn(st.page-1); };
$('next').onclick = ()=>{ unlock(); turn(st.page+1); };
function setMode(m){
  S.mode=m; save(); ui();
  status(m==='auto' ? `自動翻頁：每頁讀完等 ${S.delay} 秒翻到下一頁。按播放鍵開始。` : '手動翻頁：自己按「下一頁」翻頁。');
  if(m==='manual') clearCountdown();
}
['modeManual','sModeManual'].forEach(id=>$(id).onclick=()=>setMode('manual'));
['modeAuto','sModeAuto'].forEach(id=>$(id).onclick=()=>setMode('auto'));
function setRate(v){ S.rate=Math.round(Math.min(1.5,Math.max(.5,v))*100)/100; save(); ui(); }
$('slower').onclick=()=>setRate(S.rate-.1);
$('faster').onclick=()=>setRate(S.rate+.1);
$('rate').oninput=e=>setRate(+e.target.value);
$('pitch').oninput=e=>{ S.pitch=+e.target.value; save(); ui(); };
$('delay').oninput=e=>{ S.delay=+e.target.value; save(); ui(); };
$('autoRead').onchange=e=>{ S.autoRead=e.target.checked; save(); };
$('loop').onchange=e=>{ S.loop=e.target.checked; save(); };
$('hlOn').onchange=e=>{ S.hl=e.target.checked; save(); if(!S.hl) highlight(-1); };
$('sfxOn').onchange=e=>{ S.sfx=e.target.checked; save(); };
$('voiceSel').onchange=e=>{ S.voice=e.target.value; save(); };
$('voiceBtn').onclick=()=>{ S.voiceOn=!S.voiceOn; save(); if(!S.voiceOn && hasTTS) speechSynthesis.cancel(); if(st.playing) startReading(st.sent); ui();
  status(S.voiceOn?'朗讀聲音已開啟。':'朗讀聲音已關閉，故事會逐句標示，讓孩子自己讀。'); };
$('fsbtns').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; S.fs=[...$('fsbtns').children].indexOf(b); save(); ui(); };
$('tryVoice').onclick=()=>{ unlock(); stopAll(); st.playing=false; ui(); const run=st.run; speak('你好！每個人的身體，都是一顆最珍貴的小星球。', ()=>{}); };
const openSet=()=>{ $('sheet').hidden=false; loadVoices(); $('closeSet').focus(); };
const closeSet=()=>{ $('sheet').hidden=true; $('setBtn').focus(); };
$('setBtn').onclick=openSet; $('closeSet').onclick=closeSet; $('doneSet').onclick=closeSet;
$('sheet').onclick=e=>{ if(e.target===$('sheet')) closeSet(); };
$('dots').onclick=e=>{ const b=e.target.closest('.dot'); if(b){ unlock(); turn(+b.dataset.p); } };

spread.addEventListener('click', e=>{
  const s=e.target.closest('.sent'); if(s){ unlock(); startReading(+s.dataset.i); return; }
  const say=e.target.closest('[data-say]'); if(say){ unlock(); stopAll(); st.playing=false; ui(); speak(say.dataset.say, ()=>{}); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; unlock();
  const act=a.dataset.act;
  if(act==='listen'){ if(S.mode==='manual') setMode('auto'); turn(1, true); }
  if(act==='self'){ if(S.mode==='auto') setMode('manual'); turn(1); }
  if(act==='again') turn(1, S.mode==='auto');
  if(act==='cover') turn(0);
});
spread.addEventListener('keydown', e=>{ const s=e.target.closest('.sent'); if(s && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); unlock(); startReading(+s.dataset.i); } });
document.addEventListener('keydown', e=>{
  if(!$('sheet').hidden){ if(e.key==='Escape') closeSet(); return; }
  if(e.target.closest('input,select,textarea')) return;
  if(e.key==='ArrowRight'){ unlock(); turn(st.page+1); }
  else if(e.key==='ArrowLeft'){ unlock(); turn(st.page-1); }
  else if(e.key===' ' && (e.target===document.body)){ e.preventDefault(); togglePlay(); }
});
let tx=0, ty=0;
$('book').addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
$('book').addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60 && Math.abs(dy)<60){ unlock(); turn(st.page + (dx<0?1:-1)); }
});
window.addEventListener('pagehide', ()=>{ if(hasTTS) speechSynthesis.cancel(); });

render(0);
if(!hasTTS) status('這個瀏覽器不支援語音朗讀，仍可逐句標示與自動翻頁。');
</script>

</body></html>
